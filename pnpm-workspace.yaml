packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# Only these dependencies may run install scripts.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  msgpackr-extract: true

# Security fixes in transitive dependencies whose parents still pin vulnerable versions.
# Remove each entry once the parent ships the fix (pnpm audit --prod must stay clean).
overrides:
  # GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849: next@15 pins postcss 8.4.31.
  "next>postcss": 8.5.31
  # GHSA-q7qp-rjg7-q26m: @nestjs/platform-express@11 pins multer 2.4.0.
  "@nestjs/platform-express>multer": 2.5.0
  # GHSA-ggr8-5vv4-36mx: prisma@6.19's @prisma/config pins deepmerge-ts 7.1.5.
  "@prisma/config>deepmerge-ts": 8.0.2
