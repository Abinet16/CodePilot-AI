name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm -r --filter "./packages/**" --filter "./services/**" run build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r --filter "./apps/**" run build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  e2e:
    name: End-to-end tests (web app against a fixture API)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/**" run build
      - run: pnpm --filter @codepilot/web exec playwright install --with-deps chromium
      - run: pnpm --filter @codepilot/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  integration:
    name: Integration tests (PostgreSQL, Redis, Docker sandbox)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codepilot
          POSTGRES_PASSWORD: codepilot
          POSTGRES_DB: codepilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codepilot" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://codepilot:codepilot@localhost:5432/codepilot?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - name: Fail on schema drift between schema.prisma and migrations
        run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://codepilot:codepilot@localhost:5432/postgres" --exit-code
      - name: Build the sandbox image (container isolation and checks tests run against it)
        run: docker build -t codepilot/sandbox-node:22 services/sandbox-runner
      - run: pnpm test:integration
